<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat AZZI</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/chat-azzi.css">
</head>

<body>

<header class="chat-header">
    <button onclick="history.back()" class="chat-back">←</button>

    <div>
        <strong>Chat AZZI</strong>
        <small>مجتمع AZZI</small>
    </div>
</header>

<main class="chat-container">
<section class="chat-hero">

        <div class="chat-logo">✦</div>

        <h1>Chat AZZI</h1>

        <p>
            انشر أفكارك، اسأل، أجب، وتحدث مع مجتمع AZZI.
        </p>

    </section>

    <section class="create-card">

        <textarea
            id="postContent"
            maxlength="500"
            placeholder="ماذا تريد أن تنشر؟"
        ></textarea>
<div class="create-bottom">

            <span id="counter">
                0 / 500
            </span>

            <button id="publishBtn">
                نشر
            </button>

        </div>

    </section>

    <div class="chat-tabs">

        <button
            class="active"
            data-sort="latest"
        >
            الأحدث
        </button>

        <button
            data-sort="popular"
        >
            الأكثر تفاعلًا
        </button>

    </div>
<section id="postsContainer">

        <div class="loading">
            جاري تحميل المنشورات...
        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/chat-azzi.js"></script>

</body>
</html>
