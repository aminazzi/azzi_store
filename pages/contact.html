<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>اتصل بنا | AZZI STORE</title>

    <link rel="stylesheet" href="../assets/css/style.css">

    <style>

        .contact-page {
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .contact-container {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }

        .contact-title {
            text-align: center;
            margin-bottom: 10px;
        }

        .contact-description {
            text-align: center;
            opacity: 0.8;
            margin-bottom: 30px;
        }
      .contact-card {
            display: flex;
            align-items: center;
            gap: 18px;

            padding: 18px;
            margin-bottom: 15px;

            border-radius: 15px;

            background: rgba(255,255,255,0.08);

            text-decoration: none;
            color: inherit;

            transition: 0.2s;
        }

        .contact-card:hover {
            transform: translateY(-3px);
        }

        .contact-icon {
            font-size: 32px;
            min-width: 45px;
            text-align: center;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .contact-info strong {
            font-size: 18px;
        }

        .contact-info span {
            opacity: 0.75;
            direction: ltr;
        }

        .back-home {
            display: block;
            width: fit-content;

            margin: 30px auto 0;

            padding: 12px 25px;

            border-radius: 12px;

            text-decoration: none;

            background: #222;
            color: white;
        }

    </style>

</head>
