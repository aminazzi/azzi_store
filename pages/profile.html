           <!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>الملف الشخصي - AZZI STORE</title>
<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
    }

    .profile-container {
        width: min(92%, 600px);
        margin: 40px auto;
    }

    .profile-card {
        background: white;
        border-radius: 20px;
        padding: 30px 20px;
        text-align: center;
        box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }
.avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #eee;
    }

    .avatar-placeholder {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        margin: auto;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #eee;
        font-size: 55px;
    }

    #display-name {
        margin: 15px 0 8px;
        font-size: 25px;
    }

    #gender {
        color: #777;
    }
.bio {
        margin: 25px auto;
        max-width: 500px;
        line-height: 1.8;
        color: #555;
    }

    .info {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 20px;
    }

    .info-box {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 12px;
    }
.back-btn {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 13px;

        border: none;
        border-radius: 12px;

        background: #222;
        color: white;

        font-size: 16px;
        cursor: pointer;
    }

    .loading {
        text-align: center;
        padding: 50px;
    }

</style>

</head>
<body>

<div class="profile-container">

    <div id="loading" class="loading">
        جاري تحميل الملف الشخصي...
    </div>
<div id="profile"
         class="profile-card"
         style="display:none;">

        <div id="avatar-container"></div>

        <h1 id="display-name"></h1>

        <div id="gender"></div>

        <p id="bio" class="bio"></p>
<div class="info">

            <div class="info-box">

                ⭐ النقاط

                <br>

                <strong id="points">
                    0
                </strong>

            </div>


            <div class="info-box">

                🎯 المهام

                <br>

                <strong id="tasks">
                    0
                </strong>

            </div>

        </div>
<button
            class="back-btn"
            onclick="history.back()">

            ← رجوع

        </button>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/auth.js"></script>
<script>

async function loadProfile() {

    const user = await getCurrentUser();

    if (!user) {

        window.location.href = "login.html";

        return;
    }
const profile = await getUserProfile();

    if (!profile) {

        document.getElementById("loading").textContent =
            "تعذر تحميل الملف الشخصي.";

        return;
    }

    document.getElementById("loading").style.display =
        "none";

    document.getElementById("profile").style.display =
        "block";
document.getElementById("display-name").textContent =
        profile.display_name || "مستخدم جديد";


    document.getElementById("bio").textContent =
        profile.bio || "لا توجد سيرة ذاتية.";
if (profile.gender === "male") {

        document.getElementById("gender").textContent =
            "♂ ذكر";

    }

    else if (profile.gender === "female") {

        document.getElementById("gender").textContent =
            "♀ أنثى";

    }

    else {

        document.getElementById("gender").textContent =
            "لم يتم تحديد الجنس";
    }
if (profile.avatar_url) {

        document.getElementById("avatar-container").innerHTML =

            `<img
                class="avatar"
                src="${profile.avatar_url}"
                alt="صورة الملف الشخصي">`;

    }

    else {

        document.getElementById("avatar-container").innerHTML =

            `<div class="avatar-placeholder">
                👤
            </div>`;
    }

}
loadProfile();

</script>

</body>

</html>
